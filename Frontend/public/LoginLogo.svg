<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Chef Hat Yellow/Gold Gradient -->
    <linearGradient id="hatYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF566" />
      <stop offset="55%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>

    <!-- Chef Hat Glossy White Highlight -->
    <radialGradient id="hatHighlight" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#FFF9B0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFD400" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Orange Gradient for 'C' -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00" />
      <stop offset="50%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#E63900" />
    </linearGradient>

    <!-- Vibrant Blue Gradient for 'M' -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="50%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <!-- Soft Subtle Outer Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2942" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Crisp White Circular Badge -->
  <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="5" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="#EBF1F5" stroke-width="2.5" />

  <!-- Bright Yellow Chef Hat -->
  <g transform="translate(250, 128)">
    <!-- Main Hat Puffs -->
    <path d="M -52,14 
             C -76,12 -84,-20 -58,-34 
             C -54,-66 -12,-76 0,-54 
             C 12,-76 54,-66 58,-34 
             C 84,-20 76,12 52,14 Z" fill="url(#hatYellow)" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Glossy Highlight Overlay on Hat -->
    <ellipse cx="-8" cy="-26" rx="34" ry="24" fill="url(#hatHighlight)" />

    <!-- Curved White Band -->
    <path d="M -46,16 Q 0,8 46,16 L 44,31 Q 0,23 -44,31 Z" fill="#FFFFFF" stroke="#DCE6EE" stroke-width="1.5" />
    
    <!-- Bright Blue Curved Trim at Base -->
    <path d="M -44,31 Q 0,23 44,31 L 43,39 Q 0,31 -43,39 Z" fill="url(#blueGrad)" />
  </g>

  <!-- Interlocking Bright 'CM' Monogram -->
  <g transform="translate(250, 232)">
    <!-- Bold Orange 'C' with Sweeping Swooshed Tail -->
    <path d="M -28,-38 
             A 48,48 0 1,0 -15,43 
             C 2,36 14,22 22,6 
             C 8,16 -6,23 -20,24 
             A 26,26 0 1,1 -28,-16 
             C -20,-16 -14,-21 -14,-27 
             C -14,-33 -20,-38 -28,-38 Z" fill="url(#orangeGrad)" />

    <!-- Bold Rounded Blue 'M' -->
    <path d="M 10,44 
             L 10,-32 
             C 10,-42 22,-46 29,-38 
             L 56,-6 
             L 83,-38 
             C 90,-46 102,-42 102,-32 
             L 102,44 
             C 102,51 96,56 89,56 
             C 82,56 76,51 76,44 
             L 76,-4 
             L 63,11 
             C 59,16 53,16 49,11 
             L 36,-4 
             L 36,44 
             C 36,51 30,56 23,56 
             C 16,56 10,51 10,44 Z" transform="translate(-14, -10)" fill="url(#blueGrad)" />
  </g>

  <!-- Typography: COOKING MASTER -->
  <text x="250" y="344" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="1.5" fill="#0D2B45" text-anchor="middle">
    COOKING
  </text>

  <text x="250" y="388" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#0D2B45" text-anchor="middle">
    MASTER
  </text>

  <!-- Bottom Divider with Star & Flame Emblem -->
  <g transform="translate(250, 416)">
    <!-- Left Tapered Line -->
    <polygon points="-75,0 -28,-2 -28,2" fill="#0D2B45" />
    
    <!-- Small Five-Point Star -->
    <polygon points="-17,-5 -15.5,-1.5 -11.5,-1.5 -14.5,1 -13.5,4.5 -17,2.5 -20.5,4.5 -19.5,1 -22.5,-1.5 -18.5,-1.5" fill="#0D2B45" />
    
    <!-- Center Flame Icon -->
    <path d="M 0,-11 
             C 4,-6 9,-2 9,4 
             C 9,9 5,13 0,13 
             C -5,13 -9,9 -9,4 
             C -9,1 -7,-2 -5,-4 
             C -5,-1 -4,1 -2,1 
             C -3,-3 -2,-8 0,-11 Z" fill="#0D2B45" />
    <!-- Inner Flame Cutout -->
    <path d="M 0,2 C 2,4 3,6 3,8 C 3,10 1.5,11 0,11 C -1.5,11 -3,10 -3,8 C -3,6 -2,4 0,2 Z" fill="#FFFFFF" />

    <!-- Right Tapered Line -->
    <polygon points="75,0 18,-2 18,2" fill="#0D2B45" />
  </g>
</svg>